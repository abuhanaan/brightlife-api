components:
  parameters:
    PageParam:
      explode: true
      in: query
      name: page
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      style: form

    limitParam:
      explode: true
      in: query
      name: limit
      required: false
      schema:
        format: int32
        maximum: 100
        type: integer
      style: form

    PerPageParam:
      in: query
      name: perPage
      schema:
        type: integer
        default: 10
        description: The number of items to return per page.
        minimum: 1

  schemas:
    PatientId:
      type: string
      format: uuid
    Email:
      type: string
      #      pattern: "^[A-Za-z0-9+_.-]+@[A-Za-z0-9.-]+${5,200}"
      format: email
    DateTime:
      type: string
      format: timestamp
    Date:
      type: string
      format: date

    CountryCode:
      type: string
      pattern: "^[A-Z]{2}$"

    CurrencyCode:
      type: string
      pattern: "^[A-Z]{3}$"

    Pagination:
      type: object
      properties:
        currentPage:
          type: integer
          minimum: 1
        totalPages:
          type: integer
          minimum: 0
        totalItems:
          type: integer
          minimum: 0
        itemsPerPage:
          type: integer
          minimum: 0

    Success:
      type: object
      required:
        - status
        - success
        - message
      properties:
        status:
          type: boolean
          default: false
        success:
          type: string
        message:
          type: string

    Errors:
      type: array
      items:
        $ref: "#/components/schemas/Error"

    Error:
      description: |
        
        **The below table describes custom error codes returned by various APIs currently**
        | Code      | error         | Message                     |
        | ----------| --------------|-----------------------------|
        | 400       | INPUT         | BAD REQUEST                 |
        | 404       | NOT_FOUND     | RESOURCE DOES NOT EXIST     |
        | 422       | UNPROCESSABLE | UNPROCESSABLE ENTITY        |
        | 401       | UNAUTHORIZED  | UNAUTHORIZED                |
        | 403       | FORBIDDEN     | FORBIDDEN                   |
        | 500       | PROCESSING    | INTERNAL SERVER ERROR       |
        | 500       | TIMEOUT       | TIMEOUT                     |
      type: object
      required:
        - status
        - error
        - message
      properties:
        status:
          type: boolean
          default: false
        error:
          type: string
        message:
          type: string

    BadRequest:
      type: object
      description: |
        Bad Request
        The request body or parameters does not conform to the schema.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: |
        Unauthorized.
        
        - Indicates the request does not contain a valid token to authenticate.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: |
        Forbidden.
            - Indicates the authenticated entity does not have the privilege to perform
              the operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    UnProcessableEntity:
      description: |
        Unprocessable entity.
        - The request body may be well-formed, but either request payload or parameters failed semantic validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InternalServerError:
      description: |
        Internal Server Error.
            - The server encountered an unexpected error while processing the request..
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ResourceNotFound:
      description: |
        Resource Not Found.
            - The requested resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

