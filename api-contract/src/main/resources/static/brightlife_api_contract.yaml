openapi: "3.0.0"

info:
  version: 1.0.0
  title: Bright-life Enhancement API
  description:
    "API documentation for Bright-life Enhancement project"
  license:
    name: "fronteersdev Inc"
    url: "https://fronteersdev.com/license"

servers:
  - url: http://localhost:7081
    description: Local test server
  - url: http://ec2-13-60-241-205.eu-north-1.compute.amazonaws.com:7081
    description: Temporary http test server
  - url: https://bright-life-enhancement.fronteers-dev.com/
    description: Dev test server

security:
  - BearerAuth: [ ]  # ⬅️ Apply JWT security globally to all endpoints
components:
  securitySchemes:
    BearerAuth:
      type: http
      description: This API uses JWT for authentication
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      explode: true
      in: query
      name: page
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      style: form

    limitParam:
      explode: true
      in: query
      name: limit
      required: false
      schema:
        format: int32
        maximum: 100
        type: integer
      style: form

    PerPageParam:
      in: query
      name: perPage
      schema:
        type: integer
        default: 10
        description: The number of items to return per page.
        minimum: 1
    idParam:
      in: path
      name: idParam
      description: A unique id to update or fetch a record.
      required: true
      schema:
        type: integer
        format: int64
    patientId:
      in: path
      name: patientId
      description: A unique id to update or fetch a patients record.
      required: true
      schema:
        type: string
    consentType:
      in: path
      name: consentType
      description: Type of the consent form.
      required: true
      schema:
        $ref: "#/components/schemas/ConsentTypeEnum"

    programType:
      in: path
      name: programType
      description: Type of the program.
      required: true
      schema:
        $ref: "#/components/schemas/ProgramTypeEnum"

  schemas:
    UserDto:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: string
        email:
          type: string

    PasswordUpdate:
      type: object
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string
        confirmPassword:
          type: string
      required:
        - oldPassword
        - newPassword
        - confirmPassword

    IdGenerationResponse:
      type: object
      properties:
        status:
          type: boolean
        message:
          type: string
        patientId:
          $ref: "#/components/schemas/PatientId"
    PatientIdValidationResponse:
      type: object
      properties:
        patientId:
          $ref: "#/components/schemas/PatientId"
        firstName:
          type: string
        middleName:
          type: string
        lastName:
          type: string
        gender:
          $ref: "#/components/schemas/GenderEnum"
        dob:
          $ref: "#/components/schemas/Date"
        phone:
          type: string
        email:
          type: string
          format: email
        address:
          $ref: '#/components/schemas/Address'

    FileUploadResponse:
      type: object
      properties:
        fileType:
          type: string
        owner:
          type: string
        fileUrl:
          type: string
    ADHDForm:
      properties:
        id:
          type: integer
          format: int64
        patientId:
          $ref: "#/components/schemas/PatientId"
        projectCompletionProblem:
          $ref: '#/components/schemas/AssessmentEnum'
        organizationRate:
          $ref: '#/components/schemas/AssessmentEnum'
        memoryRate:
          $ref: '#/components/schemas/AssessmentEnum'
        attitudeToChallenge:
          $ref: '#/components/schemas/AssessmentEnum'
        fidgetRateOnsit:
          $ref: '#/components/schemas/AssessmentEnum'
        activeToWork:
          $ref: '#/components/schemas/AssessmentEnum'
        carelessMistakes:
          $ref: '#/components/schemas/AssessmentEnum'
        attentionToBoringWork:
          $ref: '#/components/schemas/AssessmentEnum'
        concentrationRate:
          $ref: '#/components/schemas/AssessmentEnum'
        misplaceRate:
          $ref: '#/components/schemas/AssessmentEnum'
        distractionRate:
          $ref: '#/components/schemas/AssessmentEnum'
        excuseRate:
          $ref: '#/components/schemas/AssessmentEnum'
        restlessRate:
          $ref: '#/components/schemas/AssessmentEnum'
        troubleRelaxing:
          $ref: '#/components/schemas/AssessmentEnum'
        excessiveTalks:
          $ref: '#/components/schemas/AssessmentEnum'
        peopleSentenceCompletion:
          $ref: '#/components/schemas/AssessmentEnum'
        patienceOnQueue:
          $ref: '#/components/schemas/AssessmentEnum'
        interruptOthers:
          $ref: '#/components/schemas/AssessmentEnum'
      type: object

    AssessmentEnum:
      type: string
      enum:
        - Never
        - Rarely
        - Sometimes
        - Often
        - Very Often

    AnxietyDisorderForm:
      properties:
        id:
          type: integer
          format: int64
        patientId:
          $ref: "#/components/schemas/PatientId"
        nervousRate:
          type: string
        controlOverWorry:
          type: string
        excessiveWorry:
          type: string
        relaxTrouble:
          type: string
        restlessness:
          type: string
        annoyanceRate:
          type: string
        frightRate:
          type: string
        lifeInfluenceSummary:
          type: string
      type: object

    ControlledSubstanceForm:
