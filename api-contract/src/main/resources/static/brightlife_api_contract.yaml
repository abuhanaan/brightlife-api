    JwtAuthenticationResponse:
      type: object
      properties:
        token:
          type: string

    SignInRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    SignUpRequest:
      type: object
      required:
        - email
