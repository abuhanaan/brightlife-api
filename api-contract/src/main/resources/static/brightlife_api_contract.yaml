            - Individual Therapy
            - Group Therapy
            - Case Management
            - Psychiatric Rehab.
        appointmentDateTime:
          $ref: "common_models.yaml#/components/schemas/DateTime"
        purpose:
          type: string
        paymentMethod:
          $ref: '#/components/schemas/PaymentModeEnum'
        insuranceName:
          $ref: '#/components/schemas/InsuranceNameEnum'
        insuranceNumber:
          type: string

    InsuranceNameEnum:
      type: string
