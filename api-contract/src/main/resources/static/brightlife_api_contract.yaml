          example: 10
        itemsPerPage:
          type: integer
          example: 100
        appointments:
          type: array
          items:
            $ref: "#/components/schemas/Appointment"

    Appointment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        patientId:
          $ref: "common_models.yaml#/components/schemas/PatientId"
        isNew:
