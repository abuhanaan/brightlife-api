        If the search criteria is empty/null, it returns list of appointments.
      tags:
        - Appointment
      operationId: listAppointments
      parameters:
        - description: The page number (starting from 1)
          $ref: "./schemas/common_models.yaml#/components/parameters/PageParam"
        - description: How many items to return at one time (max 100)
          $ref: "./schemas/common_models.yaml#/components/parameters/limitParam"
