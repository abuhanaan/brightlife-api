          type: array
          items:
            $ref: '#/components/schemas/Review'
            maxItems: 100
        appointments:
          type: array
          items:
            $ref: '#/components/schemas/Appointment'
            maxItems: 100

    PaginatedPatients:
      type: object
      properties:
        currentPage:
          type: integer
          example: 1
        totalPages:
          type: integer
          example: 10
        itemsPerPage:
          type: integer
          example: 100
        patients:
          type: array
          items:
            $ref: "#/components/schemas/Patient"

