        - lastName
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string

    PatientId:
      type: string
      format: uuid
    Email:
      type: string
      #      pattern: "^[A-Za-z0-9+_.-]+@[A-Za-z0-9.-]+${5,200}"
      format: email
    DateTime:
      type: string
      format: date-time
    Date:
      type: string
      format: date

    CountryCode:
      type: string
      pattern: "^[A-Z]{2}$"

    CurrencyCode:
      type: string
      pattern: "^[A-Z]{3}$"

    Pagination:
      type: object
      properties:
        currentPage:
          type: integer
          minimum: 1
        totalPages:
          type: integer
          minimum: 0
        totalItems:
          type: integer
          minimum: 0
        itemsPerPage:
          type: integer
          minimum: 0

    Errors:
      type: array
      items:
        $ref: "#/components/schemas/Error"

    Error:
      description: |

        **The below table describes custom error codes returned by various APIs currently**
        | Code      | error         | Message                     |
        | ----------| --------------|-----------------------------|
        | 400       | INPUT         | BAD REQUEST                 |
        | 404       | NOT_FOUND     | RESOURCE DOES NOT EXIST     |
        | 422       | UNPROCESSABLE | UNPROCESSABLE ENTITY        |
        | 401       | UNAUTHORIZED  | UNAUTHORIZED                |
        | 403       | FORBIDDEN     | FORBIDDEN                   |
        | 500       | PROCESSING    | INTERNAL SERVER ERROR       |
        | 500       | TIMEOUT       | TIMEOUT                     |
      type: object
      required:
        - status
        - error
        - message
      properties:
        status:
          type: boolean
          default: false
        error:
          type: string
        message:
          type: string

    Success:
      type: object
      required:
        - status
        - success
        - message
      properties:
        status:
          type: boolean
          default: false
        success:
          type: string
        message:
          type: string

  responses:

    BadRequest:
      #      type: object
      description: |
        Bad Request
        The request body or parameters does not conform to the schema.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: |
        Unauthorized.

        - Indicates the request does not contain a valid token to authenticate.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: |
        Forbidden.
            - Indicates the authenticated entity does not have the privilege to perform
              the operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    UnProcessableEntity:
      description: |
        Unprocessable entity.
        - The request body may be well-formed, but either request payload or parameters failed semantic validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InternalServerError:
      description: |
        Internal Server Error.
            - The server encountered an unexpected error while processing the request..
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ResourceNotFound:
      description: |
        Resource Not Found.
            - The requested resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

paths:
  /api/v1/file/upload:
    post:
      summary:
        Uploads file to s3bucket
      security: [ ]
      tags:
        - File
      operationId: uploadFile
      requestBody:
        description: Uploads File
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - owner
                - fileType
              properties:
                fileType:
                  type: string
                owner:
                  type: string
                file:
                  type: string
                  format: binary

      responses:
        "200":
          description: File Uploaded Successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnProcessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/admin/dashboard:
    get:
      summary: Fetches Metrics For Admin Dashboard
      tags:
        - Dashboard
      operationId: getDashboard
      responses:
        "200":
          description: Admin Dashboard Metrics Fetched Successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnProcessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/patients/consent-form/upload:
    post:
      summary:
        Uploads Patients Consent Form to s3bucket
      security: [ ]
      tags:
        - Patients
      operationId: uploadConsentForm
      requestBody:
        description: Uploads Consent Form
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - patientId
                - consentType
                - patientSignDate
              properties:
                patientId:
                  type: string
                  format: uuid
                consentType:
                  $ref: "#/components/schemas/ConsentTypeEnum"
                patientSignDate:
                  $ref: "#/components/schemas/DateTime"
                file:
                  type: string
                  format: binary

      responses:
        "200":
          description: Consent Form Uploaded Successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnProcessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/patients/consent-form/{patientId}/{consentType}:
    get:
      summary:
        Retrieves Patient's Specific Consent Form.
      tags:
        - Patients
      operationId: getConsentForm
      parameters:
        - $ref: "#/components/parameters/patientId"
        - $ref: "#/components/parameters/consentType"
      responses:
        "200":
          description: Patient Consent Form Fetched Successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentForm"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnProcessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/patients/consent-form/{patientId}:
    get:
      summary:
        Retrieves All 10 Patient's Consent Forms.
      tags:
        - Patients
      operationId: getAllConsentForm
      parameters:
        - $ref: "#/components/parameters/patientId"
      responses:
        "200":
          description: All Patient Consent Forms Fetched Successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientConsentForms"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnProcessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/patients/search:
    post:
      summary:
        Searches and returns all Patients matching all of the search criteria fields passed.
        The number search results shall be constrained by the limit params in Query.
        Search criteria, applies an **AND** based search on all fields passed in the request.
        If the search criteria is empty/null, it returns list of patient
      tags:
        - Patients
      operationId: listPatients
      parameters:
        - description: The page number (starting from 1)
          $ref: "#/components/parameters/PageParam"
        - description: How many items to return at one time (max 100)
          $ref: "#/components/parameters/limitParam"
      requestBody:
        description:
          "Search criteria, applies an **AND** based search on all fields\
                \ passed in the request."
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientSearch"
      responses:
        "200":
          description: Patients Records Fetched Successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPatients"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnProcessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/patients/{patientId}:
    get:
      summary: Fetches A Patient's Details
      tags:
        - Patients
      operationId: getPatient
      parameters:
        - $ref: "#/components/parameters/patientId"
      responses:
        "200":
          description: Patient Details Fetched Successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnProcessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/patients/validate/{patientId}:
    get:
      summary: Validates A Patients Id And Returns Their Basic Information
      security: [ ]
      tags:
        - Patients
      operationId: validatePatient
      parameters:
        - $ref: "#/components/parameters/patientId"
      responses:
        "200":
          description: Patient Id Validated Successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientIdValidationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnProcessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/patients/register/id:
    get:
      summary: Generates A New Patient Id. A successful call returns a success response with a patient's id
      security: [ ]
      tags:
        - Patients
      operationId: generateId
      responses:
        "201":
          description: Patient Id Generated Successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdGenerationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnProcessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/patients/forms/register:
    post:
      summary: Registers A New Patient
      security: [ ]
      tags:
        - Patients
      operationId: register
      requestBody:
        description: This is used to register a new patient. A successful call returns a success response with a patient Id
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientRegistrationForm"
      responses:
        "201":
          description: Patient Registered Successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
