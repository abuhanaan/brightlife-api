openapi: "3.0.0"

info:
  version: 1.0.0
  title: Bright-life Enhancement API
  description:
    "API documentation for Bright-life Enhancement project"
  license:
    name: "fronteersdev Inc"
    url: "https://fronteersdev.com/license"

servers:
  - url: http://localhost:7081
    description: Local test server
  - url: https://bright-life-enhancement.fronteers-dev.com/
    description: Dev test server

components:
  securitySchemes:
    BearerAuth:
      type: http
      description: This API uses JWT for authentication
      scheme: bearer
      bearerFormat: JWT

paths:
  /api/v1/patients/search:
    post:
      summary:
        Searches and returns all Patients matching all of the search criteria fields passed.
        The number search results shall be constrained by the limit params in Query.
        Search criteria, applies an **AND** based search on all fields passed in the request.
        If the search criteria is empty/null, it returns list of patient
      tags:
        - Patients
      operationId: listPatients
      parameters:
        - description: The page number (starting from 1)
          $ref: "./schemas/common_models.yaml#/components/parameters/PageParam"
        - description: How many items to return at one time (max 100)
          $ref: "./schemas/common_models.yaml#/components/parameters/limitParam"
      requestBody:
        description:
          "Search criteria, applies an **AND** based search on all fields\
                \ passed in the request."
        required: false
        content:
          application/json:
            schema:
              $ref: "./schemas/models.yaml#/components/schemas/PatientSearch"
      responses:
        "200":
          description: Patients Records Fetched Successfully
          content:
            application/json:
              schema:
                $ref: "./schemas/models.yaml#/components/schemas/PaginatedPatients"
        "401":
          $ref: "./schemas/common_models.yaml#/components/schemas/Unauthorized"
        "403":
          $ref: "./schemas/common_models.yaml#/components/schemas/Forbidden"
        "400":
          $ref: "./schemas/common_models.yaml#/components/schemas/BadRequest"
        "422":
          $ref: "./schemas/common_models.yaml#/components/schemas/UnProcessableEntity"
        "500":
          $ref: "./schemas/common_models.yaml#/components/schemas/InternalServerError"

