<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<h1>Patient Form Submission</h1>
<p>Patient with id </strong> <span th:text="${patientId}"></span>  has just submitted their </strong> <span th:text="${consentType}"></span> form</p>

<h2>Form Details</h2>
<p><strong>Patient Name:</strong> <span th:text="${name}"></span></p>
<p><strong>Patient Email:</strong> <span th:text="${email}"></span></p>
<p><strong>Form url:</strong> <span th:text="${formUrl}"></span></p>
</body>
</html>
